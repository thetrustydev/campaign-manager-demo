<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campaign Manager Demo</title>
<style>
  :root {
    --bg: #f4f6f5;
    --panel: #ffffff;
    --border: #e0e6e4;
    --text: #1c2430;
    --muted: #64716d;
    --accent: #128c7e;
    --accent-dark: #0e6f64;
    --side: #10221f;
    --side-text: #cfe3df;
    --side-dim: #7fa39c;
    --red: #b42318; --red-bg: #fef3f2; --red-line: #fecdca;
    --amber: #b54708; --amber-bg: #fffaeb; --amber-line: #fedf89;
    --blue: #175cd3; --blue-bg: #eff8ff; --blue-line: #b2ddff;
    --green: #067647; --green-bg: #ecfdf3; --green-line: #a6f4c5;
    --chip: #eef1f0;
    --bubble: #e7fedd;
    --shadow: 0 1px 2px rgba(16, 34, 31, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101715; --panel: #18201e; --border: #2a3532;
      --text: #e6ebe9; --muted: #93a19c;
      --accent: #2fb3a2; --accent-dark: #4cc7b7;
      --side: #0b1513; --side-text: #b9cdc8; --side-dim: #6b847e;
      --red: #f2938a; --red-bg: #2c1615; --red-line: #55221f;
      --amber: #f0b064; --amber-bg: #2b2010; --amber-line: #57411b;
      --blue: #86b8f7; --blue-bg: #121e30; --blue-line: #23405f;
      --green: #6cd9a2; --green-bg: #10261b; --green-line: #1e4630;
      --chip: #232d2a; --bubble: #1d3a24; --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101715; --panel: #18201e; --border: #2a3532;
    --text: #e6ebe9; --muted: #93a19c;
    --accent: #2fb3a2; --accent-dark: #4cc7b7;
    --side: #0b1513; --side-text: #b9cdc8; --side-dim: #6b847e;
    --red: #f2938a; --red-bg: #2c1615; --red-line: #55221f;
    --amber: #f0b064; --amber-bg: #2b2010; --amber-line: #57411b;
    --blue: #86b8f7; --blue-bg: #121e30; --blue-line: #23405f;
    --green: #6cd9a2; --green-bg: #10261b; --green-line: #1e4630;
    --chip: #232d2a; --bubble: #1d3a24; --shadow: none;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  h1 { font-size: 21px; margin: 0 0 2px; letter-spacing: -.01em; }
  h2 { font-size: 16px; margin: 0 0 10px; }
  p { margin: 0 0 10px; }
  a { color: var(--accent); text-decoration: none; cursor: pointer; }
  ul, ol { margin: 0 0 10px; padding-left: 20px; }
  li { margin-bottom: 4px; }

  .demo-strip {
    background: var(--side); color: var(--side-text); font-size: 13px;
    padding: 7px 14px; text-align: center;
  }
  .demo-strip b { color: #fff; }

  .shell { display: flex; min-height: calc(100vh - 34px); }
  .sidebar {
    width: 200px; flex-shrink: 0; background: var(--side); color: var(--side-text);
    padding: 18px 10px 14px; display: flex; flex-direction: column; gap: 2px;
  }
  .brand { color: #fff; font-weight: 700; font-size: 15.5px; padding: 4px 10px 16px; }
  .nav-link {
    color: var(--side-text); padding: 9px 12px; border-radius: 8px; font-size: 14px;
    cursor: pointer; user-select: none; background: none; border: none; text-align: left;
    font-family: inherit; width: 100%; white-space: nowrap;
  }
  .nav-link:hover { background: rgba(255,255,255,.07); }
  .nav-link.active { background: var(--accent); color: #fff; }
  .nav-link:focus-visible { outline: 2px solid #fff; outline-offset: -2px; }
  .side-foot { margin-top: auto; padding: 8px 10px; font-size: 12px; color: var(--side-dim); }

  .main { flex: 1; padding: 26px 30px 60px; max-width: 1020px; min-width: 0; }

  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 18px; margin-bottom: 14px; box-shadow: var(--shadow);
  }
  .grid { display: grid; gap: 12px; margin-bottom: 14px; grid-template-columns: repeat(4, 1fr); }
  .grid.two { grid-template-columns: repeat(2, 1fr); }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .stat .lab { font-size: 12px; color: var(--muted); }
  .stat .val { font-size: 22px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }

  .tw { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px; padding: 6px 10px; border-bottom: 1px solid var(--border); letter-spacing: .02em; text-transform: uppercase; white-space: nowrap; }
  td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: top; font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: none; }

  .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
  .b-green { background: var(--green-bg); color: var(--green); }
  .b-blue { background: var(--blue-bg); color: var(--blue); }
  .b-amber { background: var(--amber-bg); color: var(--amber); }
  .b-red { background: var(--red-bg); color: var(--red); }
  .b-gray { background: var(--chip); color: var(--muted); }

  .banner { border-radius: 10px; padding: 11px 14px; margin-bottom: 12px; font-size: 14px; border: 1px solid; }
  .n-blue { background: var(--blue-bg); color: var(--blue); border-color: var(--blue-line); }
  .n-amber { background: var(--amber-bg); color: var(--amber); border-color: var(--amber-line); }
  .n-green { background: var(--green-bg); color: var(--green); border-color: var(--green-line); }

  button.btn {
    font: inherit; font-weight: 600; font-size: 14px; background: var(--accent); color: #fff;
    border: none; border-radius: 8px; padding: 10px 16px; cursor: pointer;
  }
  button.btn:hover { background: var(--accent-dark); }
  button.btn:disabled { background: var(--chip); color: var(--muted); cursor: not-allowed; }
  button.btn.ghost { background: var(--panel); color: var(--text); border: 1px solid var(--border); }
  button.btn.ghost:hover { background: var(--chip); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; }
  input[type=text], select, textarea {
    font: inherit; width: 100%; max-width: 440px; color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; background: var(--panel);
  }
  textarea { min-height: 96px; max-width: 560px; }
  .hint { font-size: 12.5px; color: var(--muted); margin-top: 4px; }

  .progress { background: var(--chip); border-radius: 999px; height: 9px; overflow: hidden; }
  .progress > div { background: var(--accent); height: 100%; transition: width .4s; }

  .bubble {
    background: var(--bubble); border-radius: 10px; padding: 10px 13px; max-width: 400px;
    font-size: 14px; white-space: pre-wrap; box-shadow: var(--shadow);
  }
  .bubble .foot { color: var(--muted); font-size: 12px; margin-top: 6px; }

  .spread { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .mt { margin-top: 12px; }
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }

  .radio-line { display: flex; gap: 8px; align-items: baseline; font-weight: 400; margin: 6px 0; cursor: pointer; }

  .steps { list-style: none; padding: 0; margin: 0; }
  .steps li { display: flex; gap: 10px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--border); margin: 0; }
  .steps li:last-child { border-bottom: none; }
  .tick { flex-shrink: 0; width: 22px; height: 22px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; transform: translateY(4px); }
  .tick.done { background: var(--green-bg); color: var(--green); }
  .tick.todo { background: var(--chip); color: var(--muted); }

  .toast {
    position: fixed; bottom: 18px; left: 50%; transform: translate(-50%, 8px);
    background: var(--side); color: #fff; padding: 11px 16px; border-radius: 10px;
    font-size: 14px; max-width: min(340px, 90vw); opacity: 0; transition: all .25s; pointer-events: none;
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) { .toast, .progress > div { transition: none; } }

  .help-block h2 { margin-top: 22px; }

  /* ---- mobile ---- */
  @media (max-width: 760px) {
    .shell { flex-direction: column; }
    .sidebar {
      width: 100%; flex-direction: row; align-items: center; gap: 4px;
      padding: 8px 10px; overflow-x: auto; -webkit-overflow-scrolling: touch;
      scrollbar-width: none; position: sticky; top: 0; z-index: 10;
    }
    .sidebar::-webkit-scrollbar { display: none; }
    .brand { display: none; }
    .nav-link { width: auto; padding: 8px 13px; font-size: 14px; }
    .side-foot { display: none; }
    .main { padding: 16px 14px 50px; }
    .grid { grid-template-columns: 1fr 1fr; }
    h1 { font-size: 19px; }
    input[type=text], select, textarea { max-width: 100%; }
    .bubble { max-width: 100%; }
    .card { padding: 14px; }
  }
</style>
</head>
<body>

<div class="demo-strip"><b>Demo</b> — example data only. Nothing is sent to anyone.</div>
<div class="shell">
  <nav class="sidebar" id="nav"></nav>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";

// ---------- demo state: starts completely fresh ----------
const fmt = n => n.toLocaleString("en-GB");
const pounds = pence => "£" + Math.round(pence / 100).toLocaleString("en-GB");

const S = {
  screen: "dashboard",
  contacts: 0,
  unsubscribed: 0,
  tierLimit: 2000,
  templates: [],
  imports: [],
  importPhase: "pick", importProgress: 0,
  wiz: { name: "", tmpl: 0, typed: "", attempted: false },
};
const NT = { name: "", cat: "UTILITY", body: "" };

// ---------- helpers ----------
const $ = sel => document.querySelector(sel);
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
let toastTimer = null;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 4200);
}
function go(screen) { S.screen = screen; render(); window.scrollTo(0, 0); }
const approvedTemplates = () => S.templates.filter(t => t.status === "approved");

// ---------- dashboard ----------
function dashboard() {
  const hasContacts = S.contacts > 0;
  const hasMessage = S.templates.length > 0;
  const step = (done, label, extra) =>
    `<li><span class="tick ${done ? "done" : "todo"}">${done ? "✓" : ""}</span><span>${label}${extra ? `<div class="muted small">${extra}</div>` : ""}</span></li>`;
  return `
    <h1>Dashboard</h1>
    <p class="muted small">Your starting point each time you open the app.</p>
    <div class="card">
      <h2>Get set up</h2>
      <ol class="steps">
        ${step(hasContacts, `<a onclick="go('contacts')"><b>Upload your contacts</b></a>`,
          hasContacts ? `${fmt(S.contacts)} contacts ready` : "A CSV file of names and numbers — you'll see exactly what it found before anything is added")}
        ${step(hasMessage, `<a onclick="go('templates')"><b>Write your message</b></a>`,
          hasMessage ? (approvedTemplates().length ? "Approved and ready to send" : "Waiting for Meta approval — usually minutes")
                     : "Meta approves the wording automatically; you get an email when it's ready")}
        ${step(false, `<a onclick="go('wizard')"><b>Start a campaign</b></a>`,
          "Pick the message, check the cost, press send — switched off in this demo")}
      </ol>
    </div>
    <div class="grid">
      <div class="stat"><div class="lab">Contacts</div><div class="val">${fmt(S.contacts)}</div></div>
      <div class="stat"><div class="lab">Unsubscribed</div><div class="val">${fmt(S.unsubscribed)}</div></div>
      <div class="stat"><div class="lab">Daily sending allowance</div><div class="val">${fmt(S.tierLimit)}<span class="muted" style="font-size:13px"> to start</span></div></div>
      <div class="stat"><div class="lab">Number health</div><div class="val"><span class="badge b-green">Healthy</span></div></div>
    </div>
    <div class="card">
      <h2>While a campaign runs</h2>
      <p class="muted small" style="margin:0">This page shows live progress — how many sent, delivered and read, and how much of
      the day's allowance is used. Sending paces itself to WhatsApp's daily limits and continues
      day by day until everyone's covered; you get an email when it finishes.</p>
    </div>`;
}

// ---------- contacts ----------
function contacts() {
  return `
    <div class="spread">
      <div><h1>Contacts</h1><p class="muted small">Everyone you can message. Add people by uploading a CSV.</p></div>
      <button class="btn" onclick="S.importPhase='pick'; go('import')">Upload a CSV</button>
    </div>
    <div class="grid two mt">
      <div class="stat"><div class="lab">Contacts</div><div class="val">${fmt(S.contacts)}</div></div>
      <div class="stat"><div class="lab">Unsubscribed (never messaged)</div><div class="val">${fmt(S.unsubscribed)}</div></div>
    </div>
    <div class="card"><h2>Past uploads</h2>
    ${S.imports.length === 0
      ? `<p class="muted" style="margin:0">Nothing uploaded yet — start with your CSV file.</p>`
      : `<div class="tw"><table>
          <thead><tr><th>File</th><th>Added</th><th>Skipped</th></tr></thead>
          <tbody>${S.imports.map(im => `<tr><td>${esc(im.file)}<div class="muted small">today</div></td><td>${fmt(im.added)}</td><td>${im.skipped}</td></tr>`).join("")}</tbody>
        </table></div>`}
    </div>`;
}

function importScreen() {
  if (S.importPhase === "pick") return `
    <h1>Upload contacts</h1>
    <p class="muted small">The app reads the file on your device and shows you what it found before anything is added.</p>
    <div class="card mt">
      <button class="btn" onclick="runImport()">Use the example file (contacts.csv)</button>
      <p class="hint mt">In this demo the file is made up — 41,007 rows, including a few messy ones on purpose.</p>
    </div>`;
  if (S.importPhase === "checking") return `
    <h1>Upload contacts</h1>
    <div class="card mt"><p style="margin:0">Reading the file…</p></div>`;
  if (S.importPhase === "review") return `
    <h1>Upload contacts</h1>
    <div class="card mt">
      <h2>Ready to add</h2>
      <ul>
        <li><b>39,555</b> valid contacts will be added</li>
        <li><b>940</b> duplicate rows in the file were merged</li>
        <li><b>512</b> rows had problems and will be skipped — e.g. row 1,204: "0771 234" is too short to be a phone number (downloadable as a list)</li>
      </ul>
      <div class="row"><button class="btn" onclick="runUpload()">Add 39,555 contacts</button>
      <button class="btn ghost" onclick="S.importPhase='pick'; render()">Choose a different file</button></div>
    </div>`;
  if (S.importPhase === "uploading") return `
    <h1>Upload contacts</h1>
    <div class="card mt">
      <p>Adding contacts… ${fmt(Math.round(39555 * S.importProgress))} of 39,555</p>
      <div class="progress"><div style="width:${S.importProgress * 100}%"></div></div>
    </div>`;
  return `
    <h1>Upload contacts</h1>
    <div class="card mt">
      <div class="banner n-green">All done — 39,555 contacts added.</div>
      <ul>
        <li><b>512</b> rows were skipped (the downloadable list says exactly why, row by row)</li>
        <li>Anyone who ever replies STOP is excluded from every future upload and send, automatically</li>
      </ul>
      <button class="btn" onclick="go('contacts')">Back to contacts</button>
    </div>`;
}
function runImport() {
  S.importPhase = "checking"; render();
  setTimeout(() => { S.importPhase = "review"; render(); }, 900);
}
function runUpload() {
  S.importPhase = "uploading"; S.importProgress = 0; render();
  const iv = setInterval(() => {
    S.importProgress = Math.min(1, S.importProgress + 0.16);
    if (S.importProgress >= 1) {
      clearInterval(iv);
      S.importPhase = "done";
      S.contacts = 39555;
      S.imports = [{ file: "contacts.csv", added: 39555, skipped: "512 invalid, 940 duplicates" }];
    }
    render();
  }, 350);
}

// ---------- messages ----------
function templates() {
  const badge = t => ({
    approved: '<span class="badge b-green">Approved — ready to send</span>',
    pending: '<span class="badge b-blue">Waiting for Meta approval</span>',
  })[t.status];
  return `
    <div class="spread">
      <div><h1>Messages</h1><p class="muted small">Every message is approved by Meta before it can be sent — that happens automatically after you write it.</p></div>
      <button class="btn" onclick="go('newTemplate')">Write a new message</button>
    </div>
    <div class="card mt">
    ${S.templates.length === 0
      ? `<p class="muted" style="margin:0">No messages yet — write your first one.</p>`
      : `<div class="tw"><table>
          <thead><tr><th>Message</th><th>Type</th><th>Status</th></tr></thead>
          <tbody>${S.templates.map(t => `
            <tr>
              <td style="min-width:200px;max-width:380px"><b>${esc(t.name)}</b><div class="muted small">${esc(t.body)}</div></td>
              <td>${t.cat === "MARKETING" ? "Marketing" : "Reminder"}</td>
              <td>${badge(t)}</td>
            </tr>`).join("")}
          </tbody></table></div>`}
    </div>`;
}

function newTemplate() {
  return `
    <h1>Write a new message</h1>
    <p class="muted small">It goes to Meta for approval when you save — usually minutes. You get an email either way.</p>
    <div class="card mt">
      <label>A short name (only you see this)</label>
      <input type="text" value="${esc(NT.name)}" placeholder="e.g. Event reminder" oninput="NT.name=this.value">
      <label>What kind of message is it?</label>
      <label class="radio-line"><input type="radio" name="cat" ${NT.cat==="UTILITY"?"checked":""} onchange="NT.cat='UTILITY';render()">
        <span><b>Plain reminder</b> — factual, about something they signed up for <span class="muted">(~1.6p per message)</span></span></label>
      <label class="radio-line"><input type="radio" name="cat" ${NT.cat==="MARKETING"?"checked":""} onchange="NT.cat='MARKETING';render()">
        <span><b>Marketing</b> — offers, tickets, anything promotional <span class="muted">(~3.8p per message)</span></span></label>
      <label>The message</label>
      <textarea placeholder="e.g. Hi {{1}}, a reminder that [event] takes place on [date] at [venue]." oninput="NT.body=this.value; $('#tprev').textContent = this.value.replace(/{{1}}/g,'Sarah') || 'Your message appears here as recipients will see it…'">${esc(NT.body)}</textarea>
      <p class="hint">"Reply STOP to opt out" is added automatically — it's required. The button below inserts each person's first name.</p>
      <button class="btn ghost" onclick="NT.body += (NT.body && !NT.body.endsWith(' ') ? ' ' : '') + '{{1}}'; render()">Insert first name</button>
    </div>
    <div class="card"><h2>Preview</h2>
      <div class="bubble"><span id="tprev">${esc(NT.body.replace(/\{\{1\}\}/g, "Sarah") || "Your message appears here as recipients will see it…")}</span><div class="foot">Reply STOP to opt out</div></div>
    </div>
    <button class="btn" onclick="saveTemplate()">Save and send for approval</button>`;
}
function saveTemplate() {
  if (!NT.name.trim() || !NT.body.trim()) { toast("Give the message a name and some wording first."); return; }
  const t = { id: Date.now(), name: NT.name.trim(), cat: NT.cat, status: "pending", body: NT.body.trim() };
  S.templates.unshift(t);
  NT.name = ""; NT.body = ""; NT.cat = "UTILITY";
  go("templates");
  toast("Sent to Meta for approval — in this demo it takes a few seconds.");
  setTimeout(() => {
    t.status = "approved";
    toast(`"${t.name}" was approved — you can now send it as a campaign.`);
    if (["templates", "dashboard", "wizard"].includes(S.screen)) render();
  }, 6000);
}

// ---------- campaigns ----------
function campaignsScreen() {
  return `
    <div class="spread">
      <div><h1>Campaigns</h1><p class="muted small">A campaign sends one approved message to your contacts.</p></div>
      <button class="btn" onclick="go('wizard')">Start a campaign</button>
    </div>
    <div class="card mt">
      <p class="muted" style="margin:0">Campaigns you run will appear here with their live progress and final delivery report.
      <span class="badge b-gray">Sending is switched off in this demo</span></p>
    </div>`;
}

function wizard() {
  const approved = approvedTemplates();
  if (S.contacts === 0) return `
    <h1>Start a campaign</h1>
    <div class="banner n-amber mt">First, <a onclick="go('contacts')">upload your contacts</a> — there's no one to send to yet.</div>`;
  if (approved.length === 0) return `
    <h1>Start a campaign</h1>
    <div class="banner n-amber mt">You need an approved message first — <a onclick="go('newTemplate')">write one</a>.
    ${S.templates.length ? "Yours is still waiting for approval; it only takes a moment in this demo." : ""}</div>`;

  const w = S.wiz;
  if (!w.tmpl || !approved.find(t => t.id === w.tmpl)) w.tmpl = approved[0].id;
  const t = approved.find(x => x.id === w.tmpl);
  const recipients = S.contacts - S.unsubscribed;
  const rate = t.cat === "MARKETING" ? 3.82 : 1.59;
  const cost = Math.round(recipients * rate);
  const ready = w.name.trim() && w.typed.trim().toUpperCase() === "SEND";
  return `
    <h1>Start a campaign</h1>
    <div class="card mt">
      <h2>1 — Name it</h2>
      <input type="text" placeholder="e.g. Event announcement" value="${esc(w.name)}"
        oninput="S.wiz.name=this.value; syncWizard()">
    </div>
    <div class="card">
      <h2>2 — Choose the message</h2>
      <select onchange="S.wiz.tmpl=parseInt(this.value); render()">
        ${approved.map(x => `<option value="${x.id}" ${x.id===w.tmpl?"selected":""}>${esc(x.name)} (${x.cat === "MARKETING" ? "marketing rate" : "reminder rate"})</option>`).join("")}
      </select>
      <div class="bubble mt">${esc(t.body.replace(/\{\{1\}\}/g, "Sarah"))}<div class="foot">Reply STOP to opt out</div></div>
    </div>
    <div class="card">
      <h2>3 — Who receives it</h2>
      <select><option>Everyone in your contacts</option><option>Only the upload "contacts.csv"</option></select>
      <p class="hint">Anyone who has unsubscribed is always left out automatically.</p>
    </div>
    <div class="card">
      <h2>4 — Check and send</h2>
      <ul>
        <li><b>${fmt(recipients)}</b> people will receive this message</li>
        <li>Meta will bill roughly <b>${pounds(cost)}</b> to your Meta account (${rate}p per message)</li>
        <li>Sending takes about <b>5–7 days</b> — the daily limit starts at ${fmt(S.tierLimit)} and rises automatically as you send. It runs by itself.</li>
      </ul>
      <label>Type <span class="mono">SEND</span> to confirm</label>
      <input type="text" style="max-width:130px" autocomplete="off" value="${esc(w.typed)}"
        oninput="S.wiz.typed=this.value; syncWizard()">
      ${w.attempted ? `
        <div class="banner n-green mt"><b>This is where the demo stops.</b> In the real app the campaign would now start
        sending, pace itself to WhatsApp's daily limits, and email you when it finishes — with a live progress bar on the
        dashboard the whole way through.</div>` : ""}
      <div class="mt">
        <button class="btn" id="wizGo" ${ready ? "" : "disabled"} onclick="attemptSend()">Send to ${fmt(recipients)} people</button>
      </div>
    </div>`;
}
function syncWizard() {
  const ready = S.wiz.name.trim() && S.wiz.typed.trim().toUpperCase() === "SEND";
  const b = $("#wizGo"); if (b) b.disabled = !ready;
}
function attemptSend() {
  S.wiz.attempted = true;
  render();
  window.scrollTo(0, document.body.scrollHeight);
}

// ---------- settings & help ----------
function settings() {
  return `
    <h1>Settings</h1>
    <div class="card mt"><h2>Notifications</h2>
      <label>Send notification emails to</label>
      <input type="text" value="you@example.co.uk">
      <p class="hint">You get an email when a campaign finishes, when a message is approved or rejected, and if anything ever needs you.</p>
    </div>
    <div class="card"><h2>Setup health</h2>
      <div class="tw"><table><tbody>
        ${["WhatsApp connection", "Sending number", "Webhook security", "Email sending", "Database"].map(x =>
          `<tr><td>${x}</td><td><span class="badge b-green">Connected</span></td></tr>`).join("")}
      </tbody></table></div>
      <p class="hint">Configured once during handover — shouldn't ever change.</p>
    </div>
    <div class="card"><h2>Unsubscribed numbers</h2>
      <p class="muted small" style="margin:0">Anyone who replies STOP appears here and is never messaged again — automatically,
      forever. You can also add numbers by hand.</p>
    </div>`;
}

function help() {
  return `
    <div class="help-block" style="max-width:700px">
      <h1>Help</h1>
      <p class="muted small">The real app ships with a full plain-English manual on this page. A taste of it:</p>
      <h2>Running a campaign, start to finish</h2>
      <ol>
        <li><b>Contacts</b> → upload a CSV. You see exactly what it found before anything happens.</li>
        <li><b>Messages</b> → write the message. Meta approves it automatically — you get an email when it's ready.</li>
        <li><b>Campaigns</b> → pick the message, check the cost estimate, type SEND.</li>
        <li>Done. Sending paces itself and emails you when it finishes.</li>
      </ol>
      <h2>Why sending takes days, not minutes</h2>
      <p>WhatsApp limits how many <i>new</i> people a business can message per day, and raises the limit
      automatically as you send and people don't complain. The app handles the pacing entirely by itself —
      "Done for today" is normal, not a problem.</p>
      <h2>The price difference between message types</h2>
      <p>A plain factual reminder costs roughly 1.6p per message; anything promotional counts as marketing at
      roughly 3.8p. Meta decides the category when it approves the wording — the app always shows the cost
      estimate before you confirm.</p>
    </div>`;
}

// ---------- shell ----------
const SCREENS = {
  dashboard: { label: "Dashboard", fn: dashboard },
  campaigns: { label: "Campaigns", fn: campaignsScreen },
  contacts: { label: "Contacts", fn: contacts },
  templates: { label: "Messages", fn: templates },
  settings: { label: "Settings", fn: settings },
  help: { label: "Help", fn: help },
};
const HIDDEN = { wizard: wizard, import: importScreen, newTemplate: newTemplate };

function render() {
  const navActive = { wizard: "campaigns", import: "contacts", newTemplate: "templates" }[S.screen] || S.screen;
  $("#nav").innerHTML = `<div class="brand">Campaign Manager</div>` +
    Object.entries(SCREENS).map(([k, v]) =>
      `<button class="nav-link ${navActive === k ? "active" : ""}" onclick="go('${k}')">${v.label}</button>`).join("") +
    `<div class="side-foot">Signed in as the owner (demo)</div>`;
  $("#main").innerHTML = (SCREENS[S.screen]?.fn || HIDDEN[S.screen] || dashboard)();
}
render();
</script>
</body>
</html>
